org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 по умолчанию включает строгий режим R8: «-keep class X» больше не сохраняет конструктор без параметров.
# Правила внутри ML Kit (регистраторы) и WorkManager (база Room) рассчитаны на прежний режим — без этой строки
# релиз падает при запуске (проверено на эмуляторе 27.11.2026).
android.r8.strictFullModeForKeepRules=false
