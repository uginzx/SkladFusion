# Настройки сборки приложения — всё в одном месте. Кодировка UTF-8.
# Любое значение можно переопределить без правки файла:
#   ./gradlew assembleRelease -PappName="Мой склад" -PappId=com.example.mysklad -Pserver=https://sklad.example.com
# или в файле sklad.local.properties рядом (в git не кладётся).

# Название приложения на телефоне и на экране входа.
appName=SkladFusion
# Пакет (applicationId). У каждой организации свой: от него зависят обновления и подпись.
appId=app.skladfusion
# Адрес сервера склада (https://…). Пусто — кладовщик вводит адрес на экране входа при первом запуске.
server=
# Можно ли сменить адрес на экране входа, если он задан при сборке (true/false).
serverEditable=true
# Версия: перед каждой выкладкой поднимайте versionCode — телефоны обновляются только на больший код.
versionCode=1
versionName=1.0.0
